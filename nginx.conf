server {
  listen 80;
  server_name _;

  # Health check (GKE)
  location = / {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Serve static assets
  location /admin/static/ {
    alias /usr/share/nginx/html/static/;
    try_files $uri =404;
  }

  # Serve CRA under /admin (IMPORTANT: no trailing slash)
  location /admin {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
